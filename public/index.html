<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concord — compartilhe sua tela</title><link rel="stylesheet" href="style.css"></head><body>
<main class="shell"><section class="brand"><div class="mark" aria-label="Símbolo do Concord">☭</div><h1>Concord</h1><p>Compartilhe sua tela sem complicação.</p></section>
<section id="lobby" class="card"><h2>Entre em uma sala</h2><p class="muted">Crie um espaço privado e mande o link para quem você quiser.</p><label>Seu nome<input id="name" maxlength="30" placeholder="Como quer ser chamado?"></label><label>Código da sala<input id="room" maxlength="32" placeholder="ex.: equipe-design"></label><div class="actions"><button id="create" class="primary">Criar sala</button><button id="join">Entrar</button></div></section>
<section id="roomView" hidden><header><div><span class="eyebrow">SALA</span><h2 id="roomTitle"></h2></div><button id="copyLink">Copiar convite</button><button id="leave">Sair</button></header><div class="layout"><div class="stage"><div id="emptyState" class="empty"><span>▣</span><h3>Nenhuma tela sendo transmitida</h3><p>Comece a compartilhar quando estiver pronto.</p></div><div id="videos" class="videos"></div><div class="toolbar"><button id="share" class="primary">Compartilhar tela</button><button id="stop" hidden>Parar compartilhamento</button><span id="status">Conectando…</span></div></div><aside class="chat"><div class="chatHead"><strong>Chat</strong><span id="people">1 pessoa</span></div><div id="messages" class="messages"></div><form id="chatForm"><input id="chatInput" maxlength="1000" placeholder="Escreva uma mensagem"><button>Enviar</button></form></aside></div></section></main><script src="app.js"></script></body></html>
